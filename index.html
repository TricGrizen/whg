    <!-- 启动黑匣子＋慢网提示条：纯手写 ES5，不依赖任何构建产物——构建产物挂掉时它也还在。

         资源加载失败/未捕获报错/未处理的 rejection 一并记进流水（下次白屏能查出死因）。
         流水家人看不见，是给管理台「启动史」与远程验尸用的。

         2026-07-31 主人拍板：整套看门狗行动系统就地拆除。从前是「6 秒没起来就自己动手」——
         注销 SW＋删 whg-static 再重开，十分钟内二进则画「打开卡住了」卡（重新加载/修复后重开）。
         它按「缓存烂了导致白屏」设计，可慢≠烂：主包 1.8MB，大陆冷载常超 6 秒，于是自救把好端端
         的缓存删了 → 下次开更慢（还叠加 SW 重装 400+ 资产抢带宽）→ 必然弹卡 → 家人狂点「修复后
         重开」＝反复删缓存的死循环。首装时更是无缓存可删的纯粹白重开。
         所以这里现在**不做任何动作**：不删缓存、不注销 SW、不 reload、不画卡、不拦屏。
         真遇上缓存烂了＝一直打不开，救济路径是主人向日葵进管理台按「手术修复（只清应用壳）」，
         那把刀只留在管理台一处（web/src/pages/Guan.tsx）。
         唯一留下的可见物：8 秒还没起来，在底部画一条不遮内容、无按钮、纯安抚的小字
         （id="whg-slow"）；页面起来了由 main.tsx 摘掉。 -->

var t=e&&e.target
